org: williamdst
app: trading-bot
service: trading-bot

provider:
  name: aws
  runtime: python3.10
  timeout: 600
  iam:
    role: arn:aws:iam::088357769461:role/dbt-Masterclass-Serverless-Role

  environment:
    SNOWFLAKE_USERNAME: $env:SNOWFLAKE_USERNAME
    SNOWFLAKE_PASSWORD: $env:SNOWFLAKE_PASSWORD
    SNOWFLAKE_ACCOUNT: $env:SNOWFLAKE_ACCOUNT
    SNOWFLAKE_DATABASE: $env:SNOWFLAKE_DATABASE
    SNOWFLAKE_SCHEMA: $env:SNOWFLAKE_SCHEMA
    OANDA_API_KEY: $env:OANDA_API_KEY

package:
  individually: true
  patterns:
    - '!**'
    - 'src/infrastructure/**'
    - 'src/domain/**'
    - 'src/services/**'
    - 'requirements.txt'

functions:
  Oanda-Instrument-Config:
    name: Oanda-Instrument-Config
    handler: src/data_instrument_config.lambda_handler
    memorySize: 128
    package:
      patterns:
        - 'src/data_instrument_config.py'

  Oanda-Candle-Extract:
    name: Oanda-Candle-Extract
    handler: src/data_candle_extract.lambda_handler
    memorySize: 1024
    package:
      patterns:
        - 'src/data_candle_extract.py'

  Renko-Generation:
    name: Renko-Generation
    handler: src/data_renko_generation.lambda_handler
    memorySize: 4096
    ephemeralStorageSize: 2048
    package:
      patterns:
        - 'src/data_renko_generation.py'

  Trade-Instrument-Config:
    name: Trade-Instrument-Config
    handler: src/trade_instrument_config.lambda_handler
    memorySize: 128
    package:
      patterns:
        - 'src/trade_instrument_config.py'

  Trade-Account-Config:
    name: Trade-Account-Config
    handler: src/trade_account_config.lambda_handler
    memorySize: 128
    package:
      patterns:
        - 'src/trade_account_config.py'

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin
  - serverless-dotenv-plugin

custom:
  pythonRequirements:
    slim: true
    dockerizePip: true
  prune:
    automatic: true
    number: 3  # Keep only the 3 most recent versions