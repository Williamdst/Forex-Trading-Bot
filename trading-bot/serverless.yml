org: williamdst
app: trading-bot
service: trading-bot

provider:
  name: aws
  runtime: python3.10
  timeout: 600

  environment:
    SNOWFLAKE_USERNAME: $env:SNOWFLAKE_USERNAME
    SNOWFLAKE_PASSWORD: $env:SNOWFLAKE_PASSWORD
    SNOWFLAKE_ACCOUNT: $env:SNOWFLAKE_ACCOUNT
    SNOWFLAKE_DATABASE: $env:SNOWFLAKE_DATABASE
    SNOWFLAKE_SCHEMA: $env:SNOWFLAKE_SCHEMA
    OANDA_API_KEY: $env:OANDA_API_KEY

package:
  individually: true
  patterns:
    - '!**'  # Exclude everything by default
    - 'src/integrations/**'  # Include the integrations folder for all functions
    - 'requirements.txt'

functions:
  Oanda-Instrument-Config:
    name: Oanda-Instrument-Config
    handler: src/instrument_config.lambda_handler
    memorySize: 128
    package:
      patterns:
        - 'src/instrument_config.py'

  Oanda-Candle-Extract:
    name: Oanda-Candle-Extract
    handler: src/candle_extract.lambda_handler
    memorySize: 1024
    package:
      patterns:
        - 'src/candle_extract.py'

  Renko-Generation:
    name: Renko-Generation
    handler: src/renko_generation.lambda_handler
    memorySize: 4096
    ephemeralStorageSize: 2048
    package:
      patterns:
        - 'src/renko_generation.py'

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin
  - serverless-dotenv-plugin

custom:
  pythonRequirements:
    slim: true
    dockerizePip: true
  prune:
    automatic: true
    number: 3  # Keep only the 3 most recent versions