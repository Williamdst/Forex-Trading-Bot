org: williamdst
app: trading-bot
service: trading-bot

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.9
  timeout: 300

  environment:
    SNOWFLAKE_USERNAME: $env:SNOWFLAKE_USERNAME
    SNOWFLAKE_PASSWORD: $env:SNOWFLAKE_PASSWORD
    SNOWFLAKE_ACCOUNT: $env:SNOWFLAKE_ACCOUNT
    SNOWFLAKE_DATABASE: $env:SNOWFLAKE_DATABASE
    SNOWFLAKE_SCHEMA: $env:SNOWFLAKE_SCHEMA
    OANDA_API_KEY: $env:OANDA_API_KEY

package:
  individually: true
  patterns:
    - '!**/*'  # Exclude everything by default
    - 'integrations/**'  # Include the integrations folder for all functions
    - 'requirements.txt'
    - '!__pycache__/**'
    - '!*.pyc'

functions:
  Oanda-Instrument-Config:
    name: Oanda-Instrument-Config
    handler: instrument_config.lambda_handler
    memorySize: 128
    package:
      patterns:
        - 'instrument_config.py'
        - 'integrations/**'

  Oanda-Candle-Extract:
    name: Oanda-Candle-Extract
    handler: candle_extract.lambda_handler
    memorySize: 1024
    package:
      patterns:
        - 'candle_extract.py'
        - 'integrations/**'

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin
  - serverless-dotenv-plugin

custom:
  pythonRequirements:
    slim: true
    dockerizePip: true
  prune:
    automatic: true
    number: 3  # Keep only the 3 most recent versions