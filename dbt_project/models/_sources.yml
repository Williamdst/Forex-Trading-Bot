version: 2

sources:
  - name: candle_data
    description: "Source data for the project"
    database: >-
      {%- if target.name == 'dev' -%}
        development
      {%- else -%}
        production
      {%- endif -%}
    schema: data
    tables:
      - name: hour1_renko_bricks
      - name: oanda_hour1_forex_candles

  - name: application_data
    description: "Application data for the project"
    database: >-
      {%- if target.name == 'dev' -%}
        development
      {%- else -%}
        production
      {%- endif -%}
    schema: application
    tables:
      - name: instruments